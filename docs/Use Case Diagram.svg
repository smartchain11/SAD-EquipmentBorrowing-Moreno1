<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Use Case Diagram</text>
  <text x="490" y="52" text-anchor="middle" font-size="13" fill="#64748b">Online Equipment Borrowing and Return Monitoring System</text>

  <!-- System boundary -->
  <rect x="150" y="80" width="740" height="580" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Equipment Borrowing and Return Monitoring System</text>

  <!-- Actors -->
  <ellipse cx="75" cy="260" rx="34" ry="22" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <line x1="75" y1="282" x2="75" y2="322" stroke="#0f172a" stroke-width="2"/>
  <line x1="45" y1="300" x2="105" y2="300" stroke="#0f172a" stroke-width="2"/>
  <line x1="75" y1="322" x2="55" y2="360" stroke="#0f172a" stroke-width="2"/>
  <line x1="75" y1="322" x2="95" y2="360" stroke="#0f172a" stroke-width="2"/>
  <text x="75" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">System User /</text>
  <text x="75" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Equipment Custodian</text>

  <ellipse cx="75" cy="480" rx="34" ry="22" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="75" y1="502" x2="75" y2="542" stroke="#64748b" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="45" y1="520" x2="105" y2="520" stroke="#64748b" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="75" y1="542" x2="55" y2="580" stroke="#64748b" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="75" y1="542" x2="95" y2="580" stroke="#64748b" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="75" y="600" text-anchor="middle" font-size="13" fill="#475569">Borrower</text>

  <!-- Generalization: Borrower is-a User -->
  <line x1="63" y1="460" x2="70" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Use cases: left column -->
  <ellipse cx="300" cy="150" rx="115" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="155" text-anchor="middle" font-size="13" fill="#1e3a8a">Login</text>

  <ellipse cx="300" cy="200" rx="115" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="205" text-anchor="middle" font-size="13" fill="#1e3a8a">View Dashboard</text>

  <ellipse cx="300" cy="250" rx="115" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="255" text-anchor="middle" font-size="13" fill="#1e3a8a">Add Equipment</text>

  <ellipse cx="300" cy="300" rx="115" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="305" text-anchor="middle" font-size="13" fill="#1e3a8a">View Equipment</text>

  <ellipse cx="300" cy="350" rx="115" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="355" text-anchor="middle" font-size="13" fill="#1e3a8a">Edit Equipment</text>

  <ellipse cx="300" cy="400" rx="115" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="405" text-anchor="middle" font-size="13" fill="#1e3a8a">Delete Equipment</text>

  <ellipse cx="300" cy="450" rx="115" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="455" text-anchor="middle" font-size="13" fill="#1e3a8a">Search Equipment</text>

  <!-- Use cases: right column -->
  <ellipse cx="640" cy="150" rx="125" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="155" text-anchor="middle" font-size="13" fill="#1e3a8a">Record Borrowing</text>

  <ellipse cx="640" cy="200" rx="125" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="205" text-anchor="middle" font-size="13" fill="#1e3a8a">View Transactions</text>

  <ellipse cx="640" cy="250" rx="125" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="255" text-anchor="middle" font-size="13" fill="#1e3a8a">Return Equipment</text>

  <ellipse cx="640" cy="300" rx="125" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="305" text-anchor="middle" font-size="13" fill="#1e3a8a">Search Transactions</text>

  <ellipse cx="640" cy="350" rx="125" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="355" text-anchor="middle" font-size="13" fill="#1e3a8a">Filter Transactions</text>

  <ellipse cx="640" cy="400" rx="125" ry="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="405" text-anchor="middle" font-size="13" fill="#1e3a8a">Logout</text>

  <!-- Associations: System User to left-column use cases -->
  <line x1="156" y1="258" x2="195" y2="152" stroke="#334155" stroke-width="1.4"/>
  <line x1="156" y1="267" x2="209" y2="202" stroke="#334155" stroke-width="1.4"/>
  <line x1="156" y1="276" x2="209" y2="252" stroke="#334155" stroke-width="1.4"/>
  <line x1="156" y1="282" x2="209" y2="302" stroke="#334155" stroke-width="1.4"/>
  <line x1="156" y1="287" x2="209" y2="352" stroke="#334155" stroke-width="1.4"/>
  <line x1="158" y1="292" x2="216" y2="402" stroke="#334155" stroke-width="1.4"/>
  <line x1="160" y1="295" x2="223" y2="452" stroke="#334155" stroke-width="1.4"/>

  <!-- Associations: System User to right-column use cases -->
  <path d="M 116 285 C 130 180, 520 140, 530 148" fill="none" stroke="#334155" stroke-width="1.4"/>
  <path d="M 120 292 C 160 210, 510 198, 525 198" fill="none" stroke="#334155" stroke-width="1.4"/>
  <path d="M 126 298 C 190 250, 505 248, 520 248" fill="none" stroke="#334155" stroke-width="1.4"/>
  <path d="M 130 302 C 210 300, 500 298, 512 298" fill="none" stroke="#334155" stroke-width="1.4"/>
  <path d="M 133 306 C 220 340, 490 348, 512 348" fill="none" stroke="#334155" stroke-width="1.4"/>
  <path d="M 136 308 C 240 380, 470 398, 505 398" fill="none" stroke="#334155" stroke-width="1.4"/>

  <!-- include relationships -->
  <line x1="415" y1="150" x2="455" y2="150" stroke="#9333ea" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="435" y="140" text-anchor="middle" font-size="11" fill="#9333ea" font-style="italic">&lt;&lt;include&gt;&gt;</text>
  <line x1="512" y1="250" x2="455" y2="150" stroke="#9333ea" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="520" y="195" text-anchor="middle" font-size="11" fill="#9333ea" font-style="italic">&lt;&lt;include&gt;&gt;</text>
</svg>