<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Use Case Diagram</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#64748b">Online Equipment Borrowing and Return Monitoring System  |  Lab 4 – Role-Based System</text>

  <!-- System boundary -->
  <rect x="200" y="75" width="780" height="710" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="590" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Equipment Borrowing and Return Monitoring System</text>

  <!-- ==================== USE CASES (center) ==================== -->

  <!-- Shared use cases (all roles) -->
  <ellipse cx="440" cy="145" rx="130" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="150" text-anchor="middle" font-size="13" fill="#1e3a8a">Login / Sign Up</text>

  <ellipse cx="440" cy="200" rx="130" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="205" text-anchor="middle" font-size="13" fill="#1e3a8a">View Dashboard</text>

  <ellipse cx="440" cy="255" rx="130" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="260" text-anchor="middle" font-size="13" fill="#1e3a8a">View Equipment List</text>

  <ellipse cx="440" cy="310" rx="130" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="315" text-anchor="middle" font-size="13" fill="#1e3a8a">View Transactions</text>

  <ellipse cx="440" cy="365" rx="130" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="370" text-anchor="middle" font-size="13" fill="#1e3a8a">Submit Borrow Request</text>

  <ellipse cx="440" cy="420" rx="130" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="425" text-anchor="middle" font-size="13" fill="#1e3a8a">Cancel Own Request</text>

  <ellipse cx="440" cy="475" rx="130" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="480" text-anchor="middle" font-size="13" fill="#1e3a8a">Logout</text>

  <!-- Officer / Admin use cases (right column) -->
  <ellipse cx="730" cy="200" rx="140" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="730" y="205" text-anchor="middle" font-size="13" fill="#14532d">Add / Edit / Delete Equipment</text>

  <ellipse cx="730" cy="255" rx="140" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="730" y="260" text-anchor="middle" font-size="13" fill="#14532d">Approve Borrow Request</text>

  <ellipse cx="730" cy="310" rx="140" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="730" y="315" text-anchor="middle" font-size="13" fill="#14532d">Reject Borrow Request</text>

  <ellipse cx="730" cy="365" rx="140" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="730" y="370" text-anchor="middle" font-size="13" fill="#14532d">Claim Equipment (→ Borrowed)</text>

  <ellipse cx="730" cy="420" rx="140" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="730" y="425" text-anchor="middle" font-size="13" fill="#14532d">Return Equipment</text>

  <!-- Admin-only use case -->
  <ellipse cx="730" cy="475" rx="140" ry="20" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="730" y="480" text-anchor="middle" font-size="13" fill="#831843">View Audit Logs</text>

  <!-- ==================== STATUS WORKFLOW (bottom) ==================== -->
  <rect x="215" y="530" width="750" height="230" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="590" y="554" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Borrowing Status Workflow (7 Statuses)</text>

  <!-- Status nodes -->
  <ellipse cx="295" cy="600" rx="55" ry="20" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="295" y="605" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">Pending</text>

  <ellipse cx="460" cy="570" rx="55" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Approved</text>

  <ellipse cx="460" cy="635" rx="55" ry="20" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="460" y="640" text-anchor="middle" font-size="12" font-weight="bold" fill="#831843">Rejected</text>

  <ellipse cx="295" cy="680" rx="55" ry="20" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="295" y="685" text-anchor="middle" font-size="12" font-weight="bold" fill="#831843">Cancelled</text>

  <ellipse cx="620" cy="600" rx="55" ry="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="605" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Borrowed</text>

  <ellipse cx="780" cy="570" rx="55" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="780" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Returned</text>

  <ellipse cx="780" cy="635" rx="55" ry="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="780" y="640" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Overdue</text>

  <!-- Workflow arrows -->
  <!-- Pending -> Approved -->
  <path d="M 350 593 L 405 578" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-gray)" fill="none"/>
  <text x="372" y="577" font-size="10" fill="#16a34a">Approve</text>
  <!-- Pending -> Rejected -->
  <path d="M 350 607 L 405 632" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-gray)" fill="none"/>
  <text x="355" y="630" font-size="10" fill="#dc2626">Reject</text>
  <!-- Pending -> Cancelled -->
  <path d="M 295 620 L 295 660" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-gray)" fill="none"/>
  <text x="300" y="645" font-size="10" fill="#dc2626">Cancel</text>
  <!-- Approved -> Borrowed -->
  <path d="M 515 575 L 565 595" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-gray)" fill="none"/>
  <text x="528" y="577" font-size="10" fill="#d97706">Claim</text>
  <!-- Borrowed -> Returned -->
  <path d="M 675 593 L 725 577" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-gray)" fill="none"/>
  <text x="682" y="578" font-size="10" fill="#16a34a">Return</text>
  <!-- Borrowed -> Overdue -->
  <path d="M 675 607 L 725 630" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-gray)" fill="none"/>
  <text x="677" y="630" font-size="10" fill="#dc2626">Overdue</text>
  <!-- Overdue -> Returned -->
  <path d="M 780 615 L 780 651" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrow-gray)" fill="none"/>
  <text x="784" y="638" font-size="10" fill="#16a34a">Return</text>

  <!-- ==================== ACTORS ==================== -->

  <!-- ACTOR 1: Administrator (top-left) -->
  <ellipse cx="80" cy="230" rx="22" ry="15" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <line x1="80" y1="245" x2="80" y2="280" stroke="#dc2626" stroke-width="2"/>
  <line x1="55" y1="260" x2="105" y2="260" stroke="#dc2626" stroke-width="2"/>
  <line x1="80" y1="280" x2="60" y2="310" stroke="#dc2626" stroke-width="2"/>
  <line x1="80" y1="280" x2="100" y2="310" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Administrator</text>

  <!-- ACTOR 2: Officer (mid-left) -->
  <ellipse cx="80" cy="400" rx="22" ry="15" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <line x1="80" y1="415" x2="80" y2="450" stroke="#16a34a" stroke-width="2"/>
  <line x1="55" y1="430" x2="105" y2="430" stroke="#16a34a" stroke-width="2"/>
  <line x1="80" y1="450" x2="60" y2="480" stroke="#16a34a" stroke-width="2"/>
  <line x1="80" y1="450" x2="100" y2="480" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">Officer</text>

  <!-- ACTOR 3: Borrower (right) -->
  <ellipse cx="1120" cy="380" rx="22" ry="15" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <line x1="1120" y1="395" x2="1120" y2="430" stroke="#2563eb" stroke-width="2"/>
  <line x1="1095" y1="410" x2="1145" y2="410" stroke="#2563eb" stroke-width="2"/>
  <line x1="1120" y1="430" x2="1100" y2="460" stroke="#2563eb" stroke-width="2"/>
  <line x1="1120" y1="430" x2="1140" y2="460" stroke="#2563eb" stroke-width="2"/>
  <text x="1120" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">Borrower</text>

  <!-- ==================== ASSOCIATIONS ==================== -->

  <!-- Administrator -> shared use cases -->
  <line x1="102" y1="237" x2="312" y2="148" stroke="#dc2626" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="243" x2="312" y2="203" stroke="#dc2626" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="248" x2="312" y2="258" stroke="#dc2626" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="253" x2="312" y2="313" stroke="#dc2626" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="257" x2="312" y2="368" stroke="#dc2626" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="261" x2="312" y2="423" stroke="#dc2626" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="265" x2="312" y2="478" stroke="#dc2626" stroke-width="1.2" opacity="0.6"/>
  <!-- Administrator -> admin-only use cases -->
  <path d="M 102 230 C 160 200 600 200 590 205" stroke="#dc2626" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 233 C 180 210 600 255 590 258" stroke="#dc2626" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 236 C 200 220 600 310 590 313" stroke="#dc2626" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 240 C 220 240 600 365 590 368" stroke="#dc2626" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 244 C 230 260 600 420 590 423" stroke="#dc2626" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 247 C 230 270 600 475 590 478" stroke="#dc2626" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Officer -> shared use cases -->
  <line x1="102" y1="407" x2="312" y2="203" stroke="#16a34a" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="412" x2="312" y2="258" stroke="#16a34a" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="416" x2="312" y2="313" stroke="#16a34a" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="421" x2="312" y2="368" stroke="#16a34a" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="425" x2="312" y2="423" stroke="#16a34a" stroke-width="1.2" opacity="0.6"/>
  <line x1="102" y1="429" x2="312" y2="478" stroke="#16a34a" stroke-width="1.2" opacity="0.6"/>
  <!-- Officer -> officer use cases -->
  <path d="M 102 400 C 200 330 600 203 592 205" stroke="#16a34a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 404 C 210 340 600 257 592 258" stroke="#16a34a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 408" stroke="#16a34a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 412 C 170 400 590 313 590 315" stroke="#16a34a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 420 C 160 415 590 368 590 370" stroke="#16a34a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 102 428 C 150 425 590 422 590 423" stroke="#16a34a" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Borrower -> shared use cases -->
  <path d="M 1098 382 C 900 180 580 148 572 148" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 1098 384 C 900 220 580 203 572 203" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 1098 386 C 900 260 580 258 572 258" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 1098 388 C 900 310 580 313 572 313" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 1098 390 C 900 365 580 368 572 368" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 1098 392 C 900 420 580 423 572 423" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 1098 394 C 900 475 580 478 572 478" stroke="#2563eb" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- ==================== LEGEND ==================== -->
  <rect x="215" y="78" width="200" height="96" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="225" y="96" font-size="11" font-weight="bold" fill="#475569">Legend</text>
  <ellipse cx="235" cy="110" rx="8" ry="6" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="248" y="114" font-size="11" fill="#dc2626">Administrator</text>
  <ellipse cx="235" cy="128" rx="8" ry="6" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="248" y="132" font-size="11" fill="#16a34a">Officer</text>
  <ellipse cx="235" cy="146" rx="8" ry="6" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="248" y="150" font-size="11" fill="#2563eb">Borrower</text>
  <rect x="322" y="104" width="14" height="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="113" font-size="11" fill="#14532d">Officer / Admin use case</text>
  <rect x="322" y="122" width="14" height="9" fill="#fce7f3" stroke="#db2777"/>
  <text x="340" y="131" font-size="11" fill="#831843">Admin only use case</text>
  <rect x="322" y="140" width="14" height="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="340" y="149" font-size="11" fill="#1e3a8a">All roles use case</text>
</svg>